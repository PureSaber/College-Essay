name: Bootstrap curated essay repository

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-curated-essay-repository
  cancel-in-progress: true

jobs:
  unpack-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether all archive parts are present
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            .bootstrap/repo.tar.gz.b64.part-00
            .bootstrap/repo.tar.gz.b64.part-01
            .bootstrap/repo.tar.gz.b64.part-02
            .bootstrap/repo.tar.gz.b64.part-03
            .bootstrap/repo.tar.gz.b64.part-04
            .bootstrap/repo.tar.gz.b64.part-05
          )
          for part in "${expected[@]}"; do
            if [[ ! -f "$part" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore, validate, and commit repository content
        if: steps.archive.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          from pathlib import Path

          expected_sha256 = "7f21a035ad2ba4bb5da9cf607590449f896d66a0943504f25ce4eebaa8a83b63"
          part0 = Path(".bootstrap/repo.tar.gz.b64.part-00").read_bytes()
          tail = b"".join(
              Path(f".bootstrap/repo.tar.gz.b64.part-{index:02d}").read_bytes()
              for index in range(1, 6)
          )

          def verified_archive(encoded: bytes):
              try:
                  archive = base64.b64decode(encoded, validate=True)
              except binascii.Error:
                  return None
              if hashlib.sha256(archive).hexdigest() != expected_sha256:
                  return None
              return archive

          archive = verified_archive(part0 + tail)
          if archive is None and len(part0) == 7001:
              for position in range(len(part0)):
                  archive = verified_archive(part0[:position] + part0[position + 1:] + tail)
                  if archive is not None:
                      print(f"Recovered archive after removing one transport byte at part-00 offset {position}.")
                      break

          if archive is None:
              raise SystemExit("Unable to reconstruct the verified repository archive.")

          Path("/tmp/college-essay-repo.tar.gz").write_bytes(archive)
          PY

          echo "7f21a035ad2ba4bb5da9cf607590449f896d66a0943504f25ce4eebaa8a83b63  /tmp/college-essay-repo.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/college-essay-repo.tar.gz -C .

          python scripts/validate.py
          python scripts/build_index.py
          git diff --exit-code -- docs/case-notes.md

          # A workflow token cannot create/delete workflow files. Keep this
          # bootstrap workflow unchanged and let the repository connector swap
          # it for the permanent validation workflow after content is pushed.
          rm -rf .bootstrap
          rm -f .github/workflows/validate.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add curated Hong Kong and Singapore essay corpus"
          git push origin HEAD:main
