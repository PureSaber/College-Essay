name: Validate essay catalogs

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate undergraduate catalog
        run: python scripts/validate.py
      - name: Validate graduate catalog
        run: python scripts/validate_graduate.py

      - name: Rebuild undergraduate index
        run: python scripts/build_index.py
      - name: Rebuild graduate index
        run: python scripts/build_graduate_index.py

      - name: Ensure generated files are committed
        run: git diff --exit-code -- docs/case-notes.md docs/graduate-case-notes.md
